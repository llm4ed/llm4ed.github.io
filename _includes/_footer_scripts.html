<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.ai4ed-site-nav');

  if (nav) {
    var toggle = nav.querySelector('.ai4ed-site-nav__toggle');
    var menu = nav.querySelector('.ai4ed-site-nav__menu');
    var desktopQuery = window.matchMedia('(min-width: 64.0625em)');

    function closeMenu(returnFocus) {
      if (!toggle || !menu) return;
      toggle.setAttribute('aria-expanded', 'false');
      menu.classList.remove('is-open');
      if (returnFocus) toggle.focus();
    }

    if (toggle && menu) {
      toggle.addEventListener('click', function () {
        var shouldOpen = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
        menu.classList.toggle('is-open', shouldOpen);
      });

      menu.addEventListener('click', function (event) {
        if (event.target.closest('a') && !desktopQuery.matches) closeMenu(false);
      });

      document.addEventListener('click', function (event) {
        if (!desktopQuery.matches && menu.classList.contains('is-open') && !nav.contains(event.target)) {
          closeMenu(false);
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && menu.classList.contains('is-open')) closeMenu(true);
      });

      function syncMenu() {
        if (desktopQuery.matches) closeMenu(false);
      }

      if (desktopQuery.addEventListener) desktopQuery.addEventListener('change', syncMenu);
      else desktopQuery.addListener(syncMenu);
      syncMenu();
    }
  }

  document.querySelectorAll('[data-carousel]').forEach(function (carousel) {
    var slides = Array.prototype.slice.call(carousel.querySelectorAll('.news-entry__carousel-slide'));
    var previous = carousel.querySelector('.news-entry__carousel-button--prev');
    var next = carousel.querySelector('.news-entry__carousel-button--next');
    var status = document.createElement('p');
    var index = 0;

    if (!slides.length || !previous || !next) return;

    carousel.setAttribute('role', 'region');
    carousel.setAttribute('aria-roledescription', 'carousel');
    status.className = 'ai4ed-visually-hidden';
    status.setAttribute('aria-live', 'polite');
    status.setAttribute('aria-atomic', 'true');
    carousel.appendChild(status);

    slides.forEach(function (slide, slideIndex) {
      slide.setAttribute('role', 'group');
      slide.setAttribute('aria-roledescription', 'slide');
      slide.setAttribute('aria-label', (slideIndex + 1) + ' of ' + slides.length);
    });

    function render(announce) {
      slides.forEach(function (slide, slideIndex) {
        var active = slideIndex === index;
        slide.classList.toggle('is-active', active);
        slide.hidden = !active;
        slide.setAttribute('aria-hidden', active ? 'false' : 'true');
      });
      status.textContent = announce ? 'Showing photo ' + (index + 1) + ' of ' + slides.length : '';
    }

    previous.addEventListener('click', function () {
      index = (index - 1 + slides.length) % slides.length;
      render(true);
    });

    next.addEventListener('click', function () {
      index = (index + 1) % slides.length;
      render(true);
    });

    carousel.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        previous.click();
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        next.click();
      }
    });

    if (slides.length === 1) {
      previous.hidden = true;
      next.hidden = true;
    }
    render(false);
  });

  var lightboxTriggers = document.querySelectorAll('[data-lightbox-src]');
  if (lightboxTriggers.length && typeof HTMLDialogElement !== 'undefined') {
    var lightbox = document.createElement('dialog');
    var activeTrigger = null;
    lightbox.className = 'ai4ed-lightbox';
    lightbox.setAttribute('aria-label', 'Expanded image');
    lightbox.innerHTML = [
      '<div class="ai4ed-lightbox__dialog">',
      '<button class="ai4ed-lightbox__close" type="button" aria-label="Close expanded image">&times;</button>',
      '<img class="ai4ed-lightbox__image" alt="">',
      '</div>'
    ].join('');
    document.body.appendChild(lightbox);

    var lightboxImage = lightbox.querySelector('.ai4ed-lightbox__image');
    var lightboxClose = lightbox.querySelector('.ai4ed-lightbox__close');

    function openLightbox(trigger) {
      activeTrigger = trigger;
      lightboxImage.src = trigger.getAttribute('data-lightbox-src');
      lightboxImage.alt = trigger.getAttribute('data-lightbox-alt') || '';
      document.body.classList.add('ai4ed-lightbox-open');
      lightbox.showModal();
      lightboxClose.focus();
    }

    function closeLightbox() {
      if (!lightbox.open) return;
      lightbox.close();
    }

    lightboxTriggers.forEach(function (trigger) {
      trigger.addEventListener('click', function () { openLightbox(trigger); });
    });

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (event) {
      if (event.target === lightbox) closeLightbox();
    });
    lightbox.addEventListener('cancel', function (event) {
      event.preventDefault();
      closeLightbox();
    });
    lightbox.addEventListener('close', function () {
      lightboxImage.removeAttribute('src');
      document.body.classList.remove('ai4ed-lightbox-open');
      if (activeTrigger) activeTrigger.focus();
      activeTrigger = null;
    });
  }
});
</script>
