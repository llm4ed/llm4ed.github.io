<div class="ai4ed-hero-inner">
  <div class="ai4ed-hero-inner__brand">
    <a class="ai4ed-hero-inner__logo" href="{{ '/' | absolute_url }}" title="{{ site.title }} – {{ site.slogan }}">
      <img class="ai4ed-hero-inner__logo-image" src="{{ site.url }}{{ site.baseurl }}/assets/img/{{ site.logo }}" alt="{{ site.title }} – {{ site.slogan }}">
    </a>
  </div>

  <div class="ai4ed-masthead-copy ai4ed-hero-inner__copy">
    <p class="ai4ed-masthead-copy__eyebrow">AI4ED Research Initiative</p>
    <p class="ai4ed-masthead-copy__headline">In emergency care, every second matters and every decision counts.</p>
    <p class="ai4ed-masthead-copy__body">AI4ED develops trustworthy, human-centered AI that turns complexity into clarity, helping clinicians make better decisions, improve workflow, and deliver better patient care.</p>
  </div>
</div>
